# Fixture Platform — nginx reverse proxy + SPA host.
# Serves the built React SPA, proxies /api /sadmin /ws to the ASGI app,
# and serves Django static/media directly. TLS terminates here; the
# X-Forwarded-Proto header lets Django enforce SECURE_SSL_REDIRECT/HSTS.

upstream fixture_asgi {
    server unix:/run/fixture/gunicorn.sock;
}

# --- HTTP -> HTTPS redirect ------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name 16.112.66.154 fixture.doxaed.com _;
    return 301 https://$host$request_uri;
}

# --- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 16.112.66.154 fixture.doxaed.com _;

    ssl_certificate     /etc/ssl/fixture/fixture.crt;
    ssl_certificate_key /etc/ssl/fixture/fixture.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # SPA build output.
    root /home/ubuntu/Fixture/frontend/dist;
    index index.html;

    # Compression. The SPA bundle and every JSON API response were shipping
    # uncompressed; every sibling site on this box already had this block.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml text/xml application/xml;

    client_max_body_size 25m;

    # Django-collected static (sadmin console, DRF/Swagger UI assets).
    location /static/ {
        alias /home/ubuntu/Fixture/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Form uploads carry registrant PII (rosters, ID documents); they are
    # served ONLY through the token/manager-gated API (forms ServeUploadView),
    # never straight off disk.
    location /media/form_uploads/ {
        return 404;
    }

    # User-uploaded media (public assets only, e.g. crests/share cards).
    location /media/ {
        alias /home/ubuntu/Fixture/backend/media/;
        access_log off;
        expires 7d;
    }

    # WebSocket (Channels) — scorer/referee live rooms.
    location /ws/ {
        proxy_pass http://fixture_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE streams. These are the ONLY endpoints that legitimately stay open for
    # hours, and they must be matched BEFORE the general /api/ rule below —
    # nginx takes the first regex location that matches, in file order.
    # (Both views also send X-Accel-Buffering: no as belt-and-braces.)
    location ~ ^/api/(public/tournaments/[^/]+/[^/]+/stream|notifications/stream)/ {
        proxy_pass http://fixture_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Heavy authoring operations: drawing a fixture, running the scheduler /
    # optimizer, previewing every competition, cloning a tournament. These are
    # rare, manager-only, and legitimately take minutes (CP-SAT), so they keep a
    # long deadline — the 30s below is sized for the per-tap scoring traffic
    # that has a live human waiting on it, and would cut a draw in half.
    location ~ ^/api/tournaments/[^/]+/(generate-fixtures|schedule|clone|fixtures/(preview|preview-all|publish-all|next-round))/ {
        proxy_pass http://fixture_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API + Super-admin console -> ASGI app.
    location ~ ^/(api|sadmin)/ {
        proxy_pass http://fixture_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        # An ordinary API call gets a real DEADLINE. This used to be 3600s —
        # inherited from the SSE streams that now have their own location above
        # — which meant a stalled request was never cut: the client gave up at
        # 20s (api/client.ts) and logged a 499, while the server kept the
        # request, its Postgres connection and its row locks for up to an hour.
        # That is how six scorers exhausted the connection pool (2026-08-27).
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Hashed SPA assets — long cache.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Shared match links: preview bots get server-rendered OG meta with the
    # score card; humans get the SPA (P6 reach). $fixture_is_bot comes from
    # conf.d/fixture-bot-map.conf (deploy/nginx-bot-map.conf).
    location ~ "^/m/(?<fixture_mid>[0-9a-fA-F-]{36})/?$" {
        if ($fixture_is_bot) {
            rewrite ^ /api/live/match-meta/$fixture_mid/ last;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Shared tournament links unfurl too (name + live-now line).
    location ~ "^/t/(?<fixture_tslug>[a-z0-9-]+)/(?<fixture_tid>[0-9a-fA-F-]{36})" {
        if ($fixture_is_bot) {
            rewrite ^ /api/live/tournament-meta/$fixture_tslug/$fixture_tid/ last;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA client-side routing fallback. index.html must NEVER be cached:
    # it names the hashed bundle, and a stale shell pins users to old JS.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
